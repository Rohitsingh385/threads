name: CI 

on: 
  push: 
    branches:
      - main
  pull_request:
    branches:
      - main

jobs: 
  test:
    runs-on: ubuntu-latest

    env:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/threads_test
      REDIS_URL: redis://localhost:6379
      ACCESS_TOKEN: ci_test_access_token
      REFRESH_TOKEN: ci_test_refresh_token
      EMAIL_USER: ci@test.com
      EMAIL_APP_PASSWORD: ci_test_password
      CLOUDINARY_CLOUD_NAME: ci_test 
      CLOUDINARY_API_KEY: ci_test 
      CLOUDINARY_API_SECRET: ci_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threads_test
        ports:
          - 5432:5432 
        options: >-
          --health-cm="pg_isready -U postgres -d threads_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis: 
        image: redis:7
        ports: 
          - 6379:6379

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4
        with:
          node-version: 22

      - name: Install backend dependencies 
        working-directory: backend 
        run: npm ci 
      
      - name: Run Prisma migrations
        working-directory: backend 
        run: npx prisma migrate deploy
      
      - name: Run backend tests
        working-directory: backend 
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend 
        run: npm ci 
      
      - name: Build frontend
        working-directory: frontend
        run: npm run build